name: buildcd

on:
  push:

jobs:
  build:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Don't pull LFS during checkout — we restore it from cache below.
          # This avoids re-downloading the ~700 MB video every build and
          # exhausting the 1 GB/month free LFS bandwidth.
          lfs: false

      - name: Build LFS object list (cache key)
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id

      - name: Cache LFS objects
        uses: actions/cache@v4
        with:
          path: .git/lfs
          # Key changes only when an LFS file's content changes, so the video
          # is re-fetched solely when it actually changes.
          key: lfs-${{ hashFiles('.lfs-assets-id') }}

      - name: Fetch LFS objects (only those missing from cache)
        run: git lfs pull

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Eleventy site
        # Inject the public domain so SEO/social meta emit absolute URLs.
        # Derived from the CNAME file (the GitHub Pages custom-domain config),
        # so the domain lives in exactly one place.
        run: SITE_URL="https://$(cat CNAME)" yarn eleventy

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  cd:
    name: Continuous Deployment
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
