<div class="hero-banner flex flex-row"
     style="height: 33vh; background-image: url('{{ hero_image }}'); background-size: cover; background-position: center;">
  <div class="flex flex-col justify-start">
    {% if hero_title or hero_subtitle %}
      <div class="flex flex-row bg-gray-50 bg-opacity-50 p-4 rounded-b-md items-baseline gap-4 {{ hero_color|default('text-gray-900') }}">
        {% if hero_title %}
          <h1 class="text-4xl font-bold">
            {{ hero_title }}
          </h1>
        {% endif %}
        {% if hero_subtitle %}
          <h2 class="text-lg font-medium">
            {{ hero_subtitle }}
          </h2>
        {% endif %}
      </div>
    {% endif %}
  </div>
</div>
