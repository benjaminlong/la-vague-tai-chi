<div class="gallery flex flex-wrap gap-4 justify-center">
    {% for image in gallery %}
        <div class="image-container">
            <a href="{{image.imgDir}}/{{ image.src }}">
                <img src="{{image.imgDir}}/{{ image.src }}" alt="{{ image.alt }}" class="gallery-thumb max-w-48">
            </a>
            <div class="flex flex-col text-sm">
                <div>{{ image.date }}</div>
            </div>
        </div>
    {% endfor %}
</div>
