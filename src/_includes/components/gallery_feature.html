<div id="gallery-grid" class="not-prose gallery flex flex-wrap gap-4 justify-center">
    {% for image in gallery %}
        {% galleryItem image.src, image.alt, image.title, loop.index0 %}
    {% endfor %}
</div>

<!-- Lightbox / viewer (hidden until an image is clicked) -->
<div id="gallery-lightbox"
     class="not-prose hidden fixed inset-0 z-50 items-center justify-center bg-black/90 select-none"
     role="dialog" aria-modal="true" aria-label="Visionneuse d'images" aria-hidden="true">

    <button type="button" data-lb-close
            class="absolute top-4 right-4 z-10 flex h-11 w-11 items-center justify-center rounded-full text-white hover:bg-white/25"
            aria-label="Fermer">
        <i class="fa-solid fa-xmark size-6"></i>
    </button>

    <button type="button" data-lb-prev
            class="absolute left-2 md:left-4 z-10 flex h-12 w-12 items-center justify-center rounded-full text-white hover:bg-white/25"
            aria-label="Image précédente">
        <i class="fa-solid fa-chevron-left size-6"></i>
    </button>

    <figure class="flex max-h-full max-w-full flex-col items-center gap-3 px-4">
        <img id="gallery-lightbox-img" src="" alt=""
             class="max-h-[80vh] max-w-[90vw] rounded object-contain shadow-lg">
        <figcaption id="gallery-lightbox-caption" class="text-center text-sm text-white/80"></figcaption>
    </figure>

    <button type="button" data-lb-next
            class="absolute right-2 md:right-4 z-10 flex h-12 w-12 items-center justify-center rounded-full text-white hover:bg-white/25"
            aria-label="Image suivante">
        <i class="fa-solid fa-chevron-right size-6"></i>
    </button>
</div>

<script src="{{ '/public/js/gallery-lightbox.js' | url }}" defer></script>
