{# Generic teaser card — the fallback summary used for content types that
   don't ship their own `<type>/summary.html`. #}
{% macro card(item) %}
<a href="{{ item.url }}" class="block rounded-lg border border-gray-200 bg-white p-4 no-underline shadow-sm dark:border-gray-700 dark:bg-gray-800">
    <span class="text-lg font-bold text-gray-800 dark:text-gray-100">{{ item.data.title }}</span>
    {% if item.data.description %}<p class="mt-1 text-sm text-gray-500 dark:text-gray-400">{{ item.data.description }}</p>{% endif %}
</a>
{% endmacro %}
